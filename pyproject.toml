[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sapient-sensor"
version = "0.1.0"
description = "Python SAPIENT sensor-node library"
requires-python = ">=3.12"

dependencies = [
    "protobuf",
    "grpcio-tools",
]

[tool.setuptools.packages.find]
where = ["src"]